<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Presentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="stage">

  <!-- MENU -->
  <div id="screen-menu" class="screen">
    <div class="oval menu-oval"></div>

    <div id="menu-sky"></div>

    <!-- personagem em camadas (todas do mesmo tamanho). Ordem = de trás para frente -->
    <div id="menu-char">
      <div id="eye-white"></div>
      <div id="iris"></div>
      <img id="body" src="assets/menu_corpo.png" alt="">
      <img id="brow" src="assets/menu_sobrancelha.png" alt="">
      <!-- botão secreto do nariz. Posição/tamanho em style.css (#nose) -->
      <div id="nose"></div>
    </div>

    <div id="menu-titlebox">
      <h1 id="menu-title"></h1>
      <h2 id="menu-subtitle"></h2>
      <p id="menu-info"></p>
    </div>

    <div id="menu-buttons"></div>
  </div>

  <!-- TOPIC PAGES (filled by script.js) -->
  <div id="screen-topic" class="screen">
    <div class="oval topic-oval">
      <div id="scene"><span class="placeholder-label" id="scene-label"></span></div>
    </div>
    <div id="topic-vline"></div>
    <div id="topic-title"></div>
    <div id="topic-divider"></div>
    <div id="topic-lines"></div>

    <div id="topic-tag"></div>
    <div id="topic-nav">
      <button id="btn-prev">&lt; PREV</button>
      <button id="btn-menu">MENU</button>
      <button id="btn-next">NEXT &gt;</button>
    </div>
  </div>

  <!-- CONCLUSION -->
  <div id="screen-end" class="screen">
    <div id="end-title">CONCLUSION</div>
    <div id="end-divider"></div>
    <div id="end-body"></div>
    <div id="end-nav"><button id="btn-end-menu">BACK TO MENU</button></div>
  </div>

  <div id="wipe"><div class="w1"></div><div class="w2"></div><div class="w3"></div></div>

</div>

<script src="script.js"></script>
</body>
</html>
